<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Simple Feature Section" />

        <link
            rel="icon"
            href="resources/favicon.ico"
            type="image/x-icon"
            sizes="96x96"
        />

        <title>Simple Feature Section | devChallenges.io</title>

        <!-- stylesheet -->
        <link
            rel="preload"
            as="style"
            href="./src/output-20250816.css?v=1.0.0"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link rel="stylesheet" href="./src/output-20250816.css?v=1.0.0" />
        </noscript>

        <!-- font -->
        <link
            rel="preload"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
            as="style"
            onload="this.onload=null;this.rel='stylesheet'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
            />
        </noscript>

        <!-- initial styles -->
        <style>
            h1 {
                font-size: 2rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            h3 {
                font-size: 1.25rem;
            }
            h4 {
                font-size: 1rem;
            }
            h5 {
                font-size: 0.875rem;
            }
            h6 {
                font-size: 0.75rem;
            }

            .background {
                background-image: url("./resources/Background_image.svg?v=1.0.0");
            }
        </style>
    </head>
    <body>
        <section
            class="relative bg-black-900 min-h-[100dvh] overflow-hidden background"
        >
            <main class="relative z-10 p-8">
                <div
                    class="text-center max-w-2xl mx-auto space-y-2 mb-12 md:max-w-md"
                >
                    <h1 class="text-[2.5rem] font-semibold">
                        Quality feedbacks for your SaaS products
                    </h1>
                    <p class="text-black-300">
                        The blocks & components you need
                    </p>
                </div>
                <div
                    class="flex flex-col justify-center items-center md:items-stretch gap-12 md:flex-row flex-wrap"
                >
                    <article
                        class="rounded-2xl bg-black-800 p-6 w-fit max-w-2xs shadow-2xl"
                    >
                        <figcaption class="space-y-4 mb-4">
                            <span
                                class="bg-yellow-10 p-2 rounded-full inline-block text-xl"
                                >✋</span
                            >
                            <h2 class="text-xl font-semibold">
                                Collect Feedback at Multiple Touchpoints
                            </h2>
                            <p class="text-black-300">
                                Provide a comprehensive understanding of the
                                customer experience.
                            </p>
                        </figcaption>
                        <img
                            src="./resources/photo_1.webp?v=1.0.0"
                            srcset="
                                ./resources/photo_1.webp?v=1.0.0    1x,
                                ./resources/photo_1@2x.webp?v=1.0.0 2x
                            "
                            alt="photo-1"
                            width="240"
                            height="160"
                            class="h-auto rounded-xl w-full"
                        />
                    </article>
                    <article
                        class="rounded-2xl bg-black-800 p-6 w-fit max-w-2xs shadow-2xl"
                    >
                        <figcaption class="space-y-4 mb-4">
                            <span
                                class="bg-lightBlue-50 p-2 rounded-full inline-block text-xl"
                                >🥅</span
                            >
                            <h2 class="text-xl font-semibold">
                                Ask Targeted and Specific Questions
                            </h2>
                            <p class="text-black-300">
                                Avoid vague or open-ended questions that may not
                                yield actionable insights.
                            </p>
                        </figcaption>
                        <img
                            src="./resources/photo_2.webp?v=1.0.0"
                            srcset="
                                ./resources/photo_2.webp?v=1.0.0    1x,
                                ./resources/photo_2@2x.webp?v=1.0.0 2x
                            "
                            alt="photo-2"
                            width="240"
                            height="160"
                            class="h-auto rounded-xl w-full"
                        />
                    </article>
                    <article
                        class="rounded-2xl bg-black-800 p-6 w-fit max-w-2xs shadow-2xl"
                    >
                        <figcaption class="space-y-4 mb-4">
                            <span
                                class="bg-pinkTheme p-2 rounded-full inline-block text-xl"
                                >💬</span
                            >
                            <h2 class="text-xl font-semibold">
                                Prioritize and Respond to Feedback
                            </h2>
                            <p class="text-black-300">
                                Communicate the changes or improvements you've
                                made in response to their feedback.
                            </p>
                        </figcaption>
                        <img
                            src="./resources/photo_3.webp?v=1.0.0"
                            srcset="
                                ./resources/photo_3.webp?v=1.0.0    1x,
                                ./resources/photo_3@2x.webp?v=1.0.0 2x
                            "
                            alt="photo-3"
                            width="240"
                            height="160"
                            class="h-auto rounded-xl w-full"
                        />
                    </article>
                </div>
            </main>
        </section>
    </body>
</html>
